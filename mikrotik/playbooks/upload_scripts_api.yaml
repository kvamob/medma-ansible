    - WiFi1
  gather_facts: false

  tasks:
    - name: Сохранить содержимое локальных файлов в переменные
      ansible.builtin.set_fact:
        UpdateRouterOS_src:   "{{ lookup('file', './files/UpdateRouterOS.txt') }}"
        Upgrade_Firmware_src: "{{ lookup('file', './files/UpgradeFirmware.txt') }}"

