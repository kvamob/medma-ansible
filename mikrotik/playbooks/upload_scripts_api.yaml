#        path: "system scheduler"
#      register: system_sheduler

#    - name: Print data
#      ansible.builtin.debug:
#        var: system_sheduler

    - name: Create scripts
      community.routeros.api_modify:
        hostname: "{{ inventory_hostname }}"
        password: "{{ ansible_password }}"
        username: "{{ ansible_user }}"
        timeout: 60
        path: "system script"
        data:
          - name: "UpdateRouterOS"
            source: "{{ UpdateRouterOS_src }}"
          - name: "UpgradeFirmware"
            source: "{{ Upgrade_Firmware_src }}"

    - name: Create sheduler tasks
      community.routeros.api_modify:
        hostname: "{{ inventory_hostname }}"
        password: "{{ ansible_password }}"
        username: "{{ ansible_user }}"
        timeout: 60
        path: "system scheduler"
        data:
          - name: "daily_UpdateRouterOS"
            interval: "1d"
            on-event: "UpdateRouterOS"
            start-time: "03:00:00"
          - name: "daily_UpgradeFirmware"
            interval: "1d"
            on-event: "UpgradeFirmware"
            start-time: "03:20:00"

