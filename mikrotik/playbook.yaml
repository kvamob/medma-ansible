- name: Mirotik Playbook
  hosts: all
  connection: network_cli
  gather_facts: false

  tasks:
    - name: Get OS Version
      routeros_command:
        commands: 
          - /system resource print
      register: resource_result

    - name: Get system identity
      community.routeros.command:
        commands:
          - /system identity print
      register: identity_result

#    - name: Get interface list
#      community.routeros.command:
#        commands:
#          - /interface print
#      register: interface_result
#      vars: 
#        ansible_command_timeout: 180


    - name: Display results
      debug: 
#        var: identity_result.stdout_lines
        msg:
          - "=== {{ inventory_hostname }} ==="
          - "{{ identity_result.stdout_lines }}"
          - "{{ resource_result.stdout_lines }}"
#          - "{{ interface_result.stdout_lines }}"

